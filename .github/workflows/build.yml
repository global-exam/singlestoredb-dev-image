name: build

on:
  schedule:
    - cron: "0 0 * * *"

  push:
    paths-ignore:
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"

env:
  BOOTSTRAP_LICENSE: ${{ secrets.BOOTSTRAP_LICENSE }}
  SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}

jobs:
  auto-tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            config.json

      - name: Extract version and create tag
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Increment the most recent tag published. This fork has no tags of its
          # own, so fall back to the version at the top of the changelog, which
          # the version bump commit already carries.
          if PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null)"; then
              TAG_NAME="$(echo "${PREV_TAG}" | awk -F. -v OFS=. '{$NF += 1 ; print}')"
          else
              TAG_NAME="$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | awk '{print $2}')"
              if [ -z "${TAG_NAME}" ]; then
                  echo "::error::No git tag found, and no version at the top of CHANGELOG.md"
                  exit 1
              fi
          fi

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              echo "::notice::Tag ${TAG_NAME} already exists, nothing to do"
              exit 0
          fi

          echo "Creating tag: $TAG_NAME"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Successfully created and pushed tag: $TAG_NAME"

  build-and-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: prepare build environment
        run: |
          echo "CONFIG=$(jq -c . config.json)" >> ${GITHUB_ENV}

      - name: Build image for testing
        uses: docker/build-push-action@v4
        with:
          push: false
          load: true
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            singlestore-labs/singlestoredb-dev
          build-args: |
            BOOTSTRAP_LICENSE=${{ secrets.BOOTSTRAP_LICENSE }}
            CONFIG=${{ env.CONFIG }}

      - name: Remove large and unnecessary packages
        run: |
          echo "BEFORE CLEANUP: " $(df -a $1 | awk 'NR > 1 {avail+=$4} END {print avail}') || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get remove -y '^aspnetcore-.*' || echo "::warning::The command [sudo apt-get remove -y '^aspnetcore-.*'] failed to complete successfully. Proceeding..." 
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || echo "::warning::The command [sudo apt-get remove -y '^dotnet-.*' --fix-missing] failed to complete successfully. Proceeding..."
          sudo apt-get clean || echo "::warning::The command [sudo apt-get clean] failed to complete successfully. Proceeding..."
          echo "AFTER CLEANUP: " $(df -a $1 | awk 'NR > 1 {avail+=$4} END {print avail}') || true

      - name: run tests
        run: |
          ./test/test.sh singlestore-labs/singlestoredb-dev

      - uses: anchore/scan-action/download-grype@v7
        id: grype

      - name: scan Docker image
        run: |
          ${{steps.grype.outputs.cmd}} --only-fixed singlestore-labs/singlestoredb-dev

  publish-image:
    # Run if someone pushes a tag manually, or on every push to main. Tags
    # created by auto-tag do not start a new workflow run (GITHUB_TOKEN pushes
    # never trigger workflows), so main is what actually publishes the image.
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    needs:
      - build-and-test-image

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: prepare build environment
        run: |
          echo "CONFIG=$(jq -c . config.json)" >> ${GITHUB_ENV}
          echo "IMAGE_VERSION=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | awk '{print $2}')" >> ${GITHUB_ENV}
          echo "SERVER_VERSION=$(jq -r .server config.json)" >> ${GITHUB_ENV}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          images: |
            ghcr.io/${{ github.repository_owner }}/singlestoredb-dev
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ env.IMAGE_VERSION }},enable=${{ env.IMAGE_VERSION != '' }}
            type=raw,value=${{ env.SERVER_VERSION }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.vendor=SingleStore

      - name: Build and publish image
        uses: docker/build-push-action@v4
        with:
          push: true
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOOTSTRAP_LICENSE=${{ secrets.BOOTSTRAP_LICENSE }}
            CONFIG=${{ env.CONFIG }}

  test-service:
    runs-on: ubuntu-latest
    needs:
      - publish-image

    services:
      singlestoredb:
        image: ghcr.io/${{ github.repository_owner }}/singlestoredb-dev:latest
        ports:
          - 3306:3306
          - 8080:8080
          - 9000:9000
        env:
          ROOT_PASSWORD: test
          SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}

    steps:
      - name: sanity check using mysql client
        run: |
          mysql -u root -ptest -e "SELECT 1" -h 127.0.0.1
